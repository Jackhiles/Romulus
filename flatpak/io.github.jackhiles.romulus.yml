# Flatpak build of Romulus, made by the release workflow from the Tauri .deb (copied here
# as romulus.deb): flatpak-builder --repo=repo build flatpak/io.github.jackhiles.romulus.yml
#
# Romulus starts RetroDECK (another Flatpak) and Steam on the host through
# flatpak-spawn, so it talks to org.freedesktop.Flatpak. It reads and writes
# RetroDECK's saves, states and BIOS (home folder and SD card), reads RetroDECK's own
# files for its emulator settings, edits Steam's shortcut list, and reads the
# controller directly (--device=all).
app-id: io.github.jackhiles.romulus
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: romulus
# Ubuntu 22.04's flatpak-builder runs appstream-compose, which newer SDKs don't have; a
# bundle doesn't need the composed catalogue.
appstream-compose: false
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --filesystem=/run/media
  - --filesystem=/media
  - --filesystem=~/.var/app/net.retrodeck.retrodeck
  - --filesystem=/var/lib/flatpak/app/net.retrodeck.retrodeck:ro
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
modules:
  - name: romulus
    buildsystem: simple
    sources:
      - type: file
        path: romulus.deb
      - type: file
        path: io.github.jackhiles.romulus.metainfo.xml
    build-commands:
      - ar -x romulus.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/romulus ${FLATPAK_DEST}/bin/romulus
      # Fail the build if the runtime lacks a library Romulus needs (WebKitGTK 4.1).
      - "! ldd ${FLATPAK_DEST}/bin/romulus | grep 'not found'"
      - install -Dm644 usr/share/applications/*.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Icon=.*/Icon=${FLATPAK_ID}/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - |
        for f in usr/share/icons/hicolor/*/apps/*.png; do
          size=$(basename "$(dirname "$(dirname "$f")")")
          install -Dm644 "$f" "${FLATPAK_DEST}/share/icons/hicolor/${size}/apps/${FLATPAK_ID}.png"
        done
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
