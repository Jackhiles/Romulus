[workspace]
resolver = "3"
members = ["crates/romm-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Jackhiles/Romulus"

[workspace.dependencies]
romm-api = { path = "crates/romm-api" }
library-cache = { path = "crates/library-cache" }


updater = { path = "crates/updater" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
