[workspace]
resolver = "3"
members = ["src-tauri", "crates/romm-api", "crates/library-cache", "crates/updater", "crates/launcher", "crates/sync", "crates/music"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
romm-api = { path = "crates/romm-api" }
library-cache = { path = "crates/library-cache" }


updater = { path = "crates/updater" }
launcher = { path = "crates/launcher" }
sync = { path = "crates/sync" }
music = { path = "crates/music" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
url = "2"
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }
sha2 = "0.10"
hex = "0.4"
wiremock = "0.6"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
