name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a release, or one
# like v0.2.0-test1 for a pre-release test build. The app's updater (crates/updater)
# downloads the two files named below from the latest non-pre-release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  appimage:
    # Ubuntu 22.04's older glibc keeps the AppImage compatible with SteamOS and most distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev libdbus-1-dev patchelf file
      - name: Tag matches the app version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="romulus"))')
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
      - name: Test
        run: |
          (cd ui && npm ci && npm test)
          cargo test --workspace --release
      - name: Build AppImage
        run: ui/node_modules/.bin/tauri build --bundles appimage
      - name: Name the files for the updater
        run: |
          cp target/release/bundle/appimage/*.AppImage Romulus-x86_64.AppImage
          sha256sum Romulus-x86_64.AppImage > Romulus-x86_64.AppImage.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Romulus-x86_64.AppImage
            Romulus-x86_64.AppImage.sha256
          generate_release_notes: true
          # Tags with a dash (v0.1.2-test1) are test builds: pre-releases, which the updater ignores.
          prerelease: ${{ contains(github.ref_name, '-') }}
