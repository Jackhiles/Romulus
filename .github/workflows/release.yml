name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a release, or one
# like v0.2.0-test1 for a pre-release test build. The app's updater (crates/updater)
# downloads the AppImage or Flatpak named below (and its .sha256) from the latest non-pre-release.
#
# It can also be started by hand (Actions → Release → Run workflow) with a tag name; the
# release then creates that tag on the commit it was run from.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  appimage:
    # Ubuntu 22.04's older glibc keeps the AppImage compatible with SteamOS and most distros.
    runs-on: ubuntu-22.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev libdbus-1-dev libasound2-dev patchelf file
      - name: Tag matches the app version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="romulus"))')
          case "$TAG" in v*) ;; *) echo "Tag $TAG must start with v"; exit 1 ;; esac
          tag="${TAG#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "Tag $TAG does not match Cargo.toml version $version"; exit 1
          fi
      - name: Test
        run: |
          (cd ui && npm ci && npm test)
          cargo test --workspace --release
      - name: Build AppImage and .deb
        run: ui/node_modules/.bin/tauri build --bundles appimage,deb
      - name: Name the files for the updater
        run: |
          cp target/release/bundle/appimage/*.AppImage Romulus-x86_64.AppImage
          sha256sum Romulus-x86_64.AppImage > Romulus-x86_64.AppImage.sha256
      # The Flatpak wraps the .deb's binary on the GNOME runtime (flatpak/README.md).
      - name: Build Flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          cp target/release/bundle/deb/*.deb flatpak/romulus.deb
          id=$(basename flatpak/*.yml .yml)
          flatpak-builder --user --install-deps-from=flathub --disable-rofiles-fuse --force-clean             --repo=flatpak-repo flatpak-build "flatpak/$id.yml"
          flatpak build-bundle flatpak-repo Romulus-x86_64.flatpak "$id"             --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          sha256sum Romulus-x86_64.flatpak > Romulus-x86_64.flatpak.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            Romulus-x86_64.AppImage
            Romulus-x86_64.AppImage.sha256
            Romulus-x86_64.flatpak
            Romulus-x86_64.flatpak.sha256
          generate_release_notes: true
          # Tags with a dash (v0.1.2-test1) are test builds: pre-releases, which the updater ignores.
          prerelease: ${{ contains(env.TAG, '-') }}
