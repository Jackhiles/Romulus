name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    # Ubuntu 22.04's older glibc keeps the binary compatible with SteamOS.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries (WebKitGTK, udev for gamepads, D-Bus for the keyring)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libudev-dev libdbus-1-dev libasound2-dev patchelf
      - name: Frontend
        working-directory: ui
        run: |
          npm ci
          npm run check
          npm test
          npm run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
